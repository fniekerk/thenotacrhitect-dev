<svg viewBox="28 82 144 144" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>The Not Architect</title>

  <rect x="28" y="82" width="144" height="144" rx="12" fill="#1a1a17"/>

  <defs>
    <marker id="arrc4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4a7cc7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Person (User) top-left -->
  <circle cx="58" cy="106" r="6" fill="none" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="112" x2="58" y2="126" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="116" x2="51" y2="122" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="116" x2="65" y2="122" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="126" x2="52" y2="134" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="126" x2="64" y2="134" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Arrow: User → System -->
  <line x1="70" y1="118" x2="82" y2="152" marker-end="url(#arrc4)" stroke="#4a7cc7" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.75"/>

  <!-- Central system box -->
  <rect x="72" y="152" width="56" height="34" rx="3" fill="#dce8f7" stroke="#4a7cc7" stroke-width="1.5" opacity="0.9"/>
  <text x="100" y="165" fill="rgb(26,58,107)" font-size="8.5" font-weight="500" text-anchor="middle">Blog System</text>
  <text x="100" y="175" fill="#4a7cc7" font-size="7" font-style="italic" text-anchor="middle">[software system]</text>
  <text x="100" y="183" fill="#4a7cc7" font-size="7" font-style="italic" text-anchor="middle">thenotarchitect</text>

  <!-- Arrow: System → Email -->
  <line x1="128" y1="162" x2="140" y2="142" marker-end="url(#arrgray)" stroke="#888" stroke-width="1.1" stroke-dasharray="3,2" opacity="0.65"/>

  <!-- External: Email -->
  <rect x="136" y="118" width="22" height="22" rx="3" fill="#e8e8e8" stroke="#888" stroke-width="1.2" opacity="0.85"/>
  <text x="147" y="130" fill="#444" font-size="8" text-anchor="middle">Email</text>
  <text x="147" y="138" fill="#888" font-size="7" font-style="italic" text-anchor="middle">[external]</text>

  <!-- Arrow: System → GitHub -->
  <line x1="128" y1="176" x2="140" y2="185" marker-end="url(#arrgray)" stroke="#888" stroke-width="1.1" stroke-dasharray="3,2" opacity="0.65"/>

  <!-- External: GitHub -->
  <rect x="136" y="178" width="22" height="22" rx="3" fill="#e8e8e8" stroke="#888" stroke-width="1.2" opacity="0.85"/>
  <text x="147" y="190" fill="#444" font-size="8" text-anchor="middle">GitHub</text>
  <text x="147" y="198" fill="#888" font-size="7" font-style="italic" text-anchor="middle">[content]</text>

  <!-- Arrow: Author → System -->
  <line x1="70" y1="195" x2="72" y2="186" marker-end="url(#arrc4)" stroke="#4a7cc7" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.75"/>

  <!-- Person (Author) bottom-left -->
  <circle cx="58" cy="195" r="6" fill="none" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="201" x2="58" y2="212" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="204" x2="51" y2="210" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="204" x2="65" y2="210" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="212" x2="52" y2="220" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="212" x2="64" y2="220" stroke="rgb(250,249,245)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Big orange X -->
  <line x1="36" y1="90" x2="164" y2="248" stroke="#e05a2b" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <line x1="164" y1="90" x2="36" y2="248" stroke="#e05a2b" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
</svg>
